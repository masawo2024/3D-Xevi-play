<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>XEVIOUS 3D - Area 1 (ROM配置)</title>
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;
    font-family:"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:8px;padding:8px;box-sizing:border-box;}
  #play{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;
    justify-content:center;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 40px rgba(60,120,255,.25);border-radius:6px;background:#000;
    max-width:100%;touch-action:none;}
  #help{color:#7f8fa8;font-size:12px;letter-spacing:.06em;text-align:center;
    pointer-events:none;flex:0 0 auto;line-height:1.5;}
  /* ---- on-screen controls: always *below* the play area, never on top ---- */
  #pad{display:none;flex:0 0 auto;width:100%;max-width:640px;
    justify-content:space-between;align-items:flex-end;gap:12px;}
  #pad.show{display:flex;}
  #pad button{font:inherit;color:#cfe0ff;background:#18202e;border:1px solid #33445e;
    border-radius:10px;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;
    display:flex;align-items:center;justify-content:center;font-weight:700;}
  #pad button:active,#pad button.on{background:#2b4a72;border-color:#7fb4ff;color:#fff;}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;}
  .dpad .up{grid-column:2;grid-row:1;font-size:20px;}
  .dpad .left{grid-column:1;grid-row:2;font-size:20px;}
  .dpad .down{grid-column:2;grid-row:2;font-size:20px;}
  .dpad .right{grid-column:3;grid-row:2;font-size:20px;}
  .acts{display:grid;grid-template-columns:repeat(2,minmax(92px,1fr));gap:6px;}
  .acts .big{height:58px;font-size:12px;line-height:1.15;text-align:center;flex-direction:column;}
  .acts .big small{display:block;font-size:10px;font-weight:400;opacity:.7;}
  .acts .small{height:38px;font-size:12px;color:#9fb2ca;}
  @media (pointer:coarse), (max-width:820px){
    #pad{display:flex;}
    #pad.show{display:flex;}
    #play{align-items:flex-end;}      /* keep the picture next to the thumbs */
    #help{display:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="play"><canvas id="c" width="640" height="480"></canvas></div>
  <div id="pad">
    <div class="dpad">
      <button class="up"    data-k="up"    aria-label="前進">▲</button>
      <button class="left"  data-k="left"  aria-label="左">◀</button>
      <button class="down"  data-k="down"  aria-label="後退">▼</button>
      <button class="right" data-k="right" aria-label="右">▶</button>
    </div>
    <div class="acts">
      <button class="big"   data-k="zap">ザッパー<br><small>対空</small></button>
      <button class="big"   data-k="bomb">ブラスター<br><small>対地</small></button>
      <button class="small" data-k="view">視点</button>
      <button class="small" data-k="pause">一時停止</button>
    </div>
  </div>
  <div id="help">← → ↑ ↓ / WASD 移動　　SPACE ザッパー（対空）　　Z ブラスター（対地）　　C 視点　　P 一時停止</div>
</div>

    g.gain.setValueAtTime(0.0001, t0);

    g.gain.exponentialRampToValueAtTime(Math.max(0.0003, peak*midV), t0+midT);
    g.gain.exponentialRampToValueAtTime(0.0002, t0+endT);
  }
  /* body: noise closing from 900 Hz to 50 Hz, gently saturated for weight */
  const src = AU.ctx.createBufferSource(); src.buffer = AU.noise; src.loop = true;
  const lp = AU.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.1;
  lp.frequency.setValueAtTime(900, t0);
  lp.frequency.exponentialRampToValueAtTime(50, t0+0.85);
  const ws = AU.ctx.createWaveShaper(); ws.curve = softClip(2.2); ws.oversample = '2x';
  const g = AU.ctx.createGain(); blastEnv(g, 0.012, 0.72, 0.14, 0.34, 1.15);
  src.connect(lp); lp.connect(ws); ws.connect(g); g.connect(AU.sfxG);
  src.start(t0); src.stop(t0+1.25);
  /* sub-bass punch: 95 Hz -> 26 Hz */
  const o = AU.ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(95, t0);
  o.frequency.exponentialRampToValueAtTime(26, t0+0.62);
  const go = AU.ctx.createGain(); blastEnv(go, 0.004, 0.95, 0.10, 0.45, 0.95);
  o.connect(go); go.connect(AU.sfxG); o.start(t0); o.stop(t0+1.0);
  /* deep rumble tail: everything below ~160 Hz, for over a second */
  const rs = AU.ctx.createBufferSource(); rs.buffer = AU.noise; rs.loop = true;
  const rl = AU.ctx.createBiquadFilter(); rl.type = 'lowpass'; rl.Q.value = 0.9;
  rl.frequency.setValueAtTime(180, t0);
  rl.frequency.exponentialRampToValueAtTime(38, t0+1.6);
  const rg = AU.ctx.createGain(); blastEnv(rg, 0.05, 0.42, 0.30, 0.55, 1.75);
  rs.connect(rl); rl.connect(rg); rg.connect(AU.sfxG);
  rs.start(t0); rs.stop(t0+1.85);
  /* debris crack */
  noiseBand(t0, 0.13, 0.16, 'bandpass', 2600, 700, 0.7);
}
function metalShards(){
  if (!AU.ctx || !AU.on) return;
  const t0 = AU.ctx.currentTime;
  /* inharmonic partials (x2.76, x5.40 style) -> metal, not a musical note */
  const f = [4310, 5620, 3410, 7120];

    o.type = 'triangle';
    o.frequency.setValueAtTime(f[i], t0+dt);

    const g = AU.ctx.createGain(); env(g, t0+dt, 0.002, 0.18, 0.12);
    o.connect(g); g.connect(AU.sfxG); o.start(t0+dt); o.stop(t0+dt+0.24);
  }

  noiseBand(t0+0.03, 0.11, 0.13, 'bandpass', 8200, 4300, 1.8);
}

/* --- ROM music ----------------------------------------------------------
   The arcade drives a Namco WSG (3-voice wavetable) from the sound Z80.
   sound_data.json holds the exact per-frame frequency and 0-15 volume that
   the emulated sound CPU writes to 0x6810.. .  The main ROM tells us which
   song is which (slot names are misleading):

     MAIN_THEME_SND 0x01 -> slot 1, streams 2/3/4, 3 voices, 768 frames
       started in main_gameplay_loop (xevious_main.68k:493) next to the
       "PLAYER 1 / READY" messages and the 0xA0-frame countdown
       => the level-start fanfare ('start').
     SOLVALOU_SND 0x0E -> slot 14, stream 26, 1 voice, 384 frames
       started when the solvalou object is set up (xevious_main.68k:1901),
       osd_sound_stop'ed when it is hit (xevious_main.68k:1916)
       => the in-flight theme that belongs to the ship ('bgm').

   We replay those registers through the same xvi-2.7n waveform PROM, so the
   pitch, envelope and 4-bit timbre are the ROM's own, not a guess.          */
let WAVE_TABLES = null;
function waveTables(){
  if (WAVE_TABLES) return WAVE_TABLES;
  const bin = atob(WAVE_ROM_B64);
  WAVE_TABLES = [];
  for (let w=0; w<8; w++){
    const a = new Float32Array(32);
    let mean = 0;
    for (let i=0;i<32;i++){
      a[i] = (bin.charCodeAt(w*32+i) & 0x0F) - 8;   /* waveform_r() */
      mean += a[i];
    }
    mean /= 32;
    for (let i=0;i<32;i++) a[i] -= mean;            /* the DAC is AC-coupled */
    WAVE_TABLES.push(a);
  }
  return WAVE_TABLES;
}

function synthSong(song){
  const sr = AU.ctx.sampleRate;
  const n = Math.max(1, Math.round(song.frames / MUSIC.fps * sr));
  const buf = AU.ctx.createBuffer(1, n, sr);
  const out = buf.getChannelData(0);
  const wavs = waveTables();
  const framesPerSample = MUSIC.fps / sr;
  const scale = 1 / (8 * 15 * Math.max(1, song.voices.length));
  for (const v of song.voices){
    const wave = wavs[v.wave & 7] || wavs[0];
    const ev = v.freq;
    let ei = 0, f = ev.length ? ev[0][1] : 0;
    let phase = 0;
    for (let i=0;i<n;i++){
      const fr = i * framesPerSample;
      while (ei + 1 < ev.length && ev[ei+1][0] <= fr){ ei++; f = ev[ei][1]; }
      const fi = Math.min(song.frames-1, fr|0);
      const vol = parseInt(v.vol.charAt(fi), 16) || 0;
      out[i] += wave[(phase|0) & 31] * vol * scale;
      phase += f / sr * 32;                         /* 32 PROM steps per cycle */
      if (phase >= 32) phase -= Math.floor(phase/32)*32;
    }
  }
  const ramp = Math.min(96, n>>4);                  /* kill edge clicks */
  for (let i=0;i<ramp;i++){ const k=i/ramp; out[i]*=k; out[n-1-i]*=k; }
  return buf;
}

const MUS = { bufs:{}, src:null, gen:0, mode:'' };
function musicStop(){
  MUS.gen++;
  if (MUS.src){
    try { MUS.src.onended = null; MUS.src.stop(); } catch(e){}
    try { MUS.src.disconnect(); } catch(e){}
    MUS.src = null;
  }
  MUS.mode = '';
}
function musicStart(name, loop, onDone){
  if (!AU.ctx || !AU.on) return;
  const song = MUSIC[name];
  if (!song) return;
  musicStop();
  const gen = MUS.gen;
  if (!MUS.bufs[name]) MUS.bufs[name] = synthSong(song);
  const src = AU.ctx.createBufferSource();
  src.buffer = MUS.bufs[name];
  src.loop = !!loop;
  const g = AU.ctx.createGain();
  g.gain.value = name === 'bgm' ? 0.46 : 0.58;
  src.connect(g); g.connect(AU.bgmG);
  MUS.src = src; MUS.mode = name;
  src.onended = () => {
    if (gen !== MUS.gen) return;
    MUS.src = null; MUS.mode = '';
    if (!loop && onDone) onDone();
  };
  src.start();
}
function playStartFanfare(){
  /* MAIN_THEME_SND: the level-start fanfare (3 WSG voices, 768 frames).
     Played once per game, at startGame(); losing a ship does NOT replay it,
     the in-flight theme simply keeps looping. */
  musicStart('start', false, () => { if (S.mode === 'play') musicStart('bgm', true); });
}
function playMainTheme(){ musicStart('bgm', true); }

/* ================================================================= meshes */
/* A face is [i0,i1,i2,(i3), colour]; the last number is always the colour.  */
function M(v,f){ return {v:v, f:f}; }

function fixW(m){
  let cx=0, cy=0, cz=0;
  for (const p of m.v){ cx+=p[0]; cy+=p[1]; cz+=p[2]; }
  const n = m.v.length; cx/=n; cy/=n; cz/=n;
  for (const f of m.f){
    const col = f[f.length-1];
    const a = m.v[f[0]], b = m.v[f[1]], c = m.v[f[2]];
    const ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
    const vx=c[0]-a[0], vy=c[1]-a[1], vz=c[2]-a[2];
    const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    let fx=0, fy=0, fz=0, k=0;
    for (let i=0;i<f.length-1;i++){ const p=m.v[f[i]]; fx+=p[0]; fy+=p[1]; fz+=p[2]; k++; }
    fx/=k; fy/=k; fz/=k;
    if (nx*(fx-cx)+ny*(fy-cy)+nz*(fz-cz) < 0){
      const idx = f.slice(0,-1).reverse();
      f.length = 0;
      for (const i of idx) f.push(i);
      f.push(col);
    }
  }
  return m;
}

function bake(m, dx,dy,dz){
  const v = m.v.map(p => [p[0]+dx, p[1]+dy, p[2]+dz]);
  const f = m.f.map(face => face.slice());
  return {v:v, f:f};
}

function merge(list){
  const v = [], f = [];
  for (const m of list){
    const off = v.length;
    for (const p of m.v) v.push([p[0],p[1],p[2]]);
    for (const face of m.f){
      const nf = face.slice(0,-1).map(i => i+off);
      nf.push(face[face.length-1]);
      f.push(nf);
    }
  }
  return {v:v, f:f};
}

function boxM(w,h,d,c,ct){
  const x=w/2, z=d/2;
  const v=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z],[-x,h,-z],[x,h,-z],[x,h,z],[-x,h,z]];
  const f=[[4,7,6,5,ct===undefined?c:ct],[0,1,2,3,c],[0,4,5,1,c],[3,2,6,7,c],[0,3,7,4,c],[1,5,6,2,c]];
  return fixW(M(v,f));
}

function taperM(w0,w1,h,d,c,ct){
  const z=d/2;
  const v=[[-w0/2,0,-z],[w0/2,0,-z],[w1/2,0,z],[-w1/2,0,z],
           [-w0/2,h,-z],[w0/2,h,-z],[w1/2,h,z],[-w1/2,h,z]];
  const f=[[4,7,6,5,ct===undefined?c:ct],[0,1,2,3,c],[0,4,5,1,c],[3,2,6,7,c],[0,3,7,4,c],[1,5,6,2,c]];
  return fixW(M(v,f));
}

function pyrM(w,h,d,c){
  const x=w/2, z=d/2;
  const v=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z],[0,h,0]];
  const f=[[0,1,2,3,c],[0,4,1,c],[1,4,2,c],[2,4,3,c],[3,4,0,c]];
  return fixW(M(v,f));
}

function octaM(r,h,c1,c2){
  const v=[[0,h,0],[0,-h,0],[r,0,0],[0,0,r],[-r,0,0],[0,0,-r]];
  const f=[[0,2,3,c1],[0,3,4,c1],[0,4,5,c1],[0,5,2,c1],
           [1,3,2,c2===undefined?c1:c2],[1,4,3,c2===undefined?c1:c2],
           [1,5,4,c2===undefined?c1:c2],[1,2,5,c2===undefined?c1:c2]];
  return fixW(M(v,f));
}

function cylM(r,h,seg,c,ct){
  const v=[], f=[];
  const top = [];
  for (let i=0;i<seg;i++){
    const a = TAU*i/seg;
    v.push([Math.cos(a)*r, 0, Math.sin(a)*r]);
  }
  for (let i=0;i<seg;i++){
    const a = TAU*i/seg;
    top.push(v.length);
    v.push([Math.cos(a)*r, h, Math.sin(a)*r]);
  }
  for (let i=0;i<seg;i++){
    const j=(i+1)%seg;
    f.push([i, top[i], top[j], j, c]);
  }
  f.push(top.slice().reverse().concat(ct===undefined?c:ct));
  f.push([0,1,2,3,4,5,6,7].slice(0,seg).concat(ct===undefined?c:ct));
  return fixW(M(v,f));
}

function coneM(r,h,seg,c){
  const v=[], f=[];
  for (let i=0;i<seg;i++){
    const a=TAU*i/seg;
    v.push([Math.cos(a)*r,0,Math.sin(a)*r]);
  }
  const ap=v.length; v.push([0,h,0]);
  for (let i=0;i<seg;i++) f.push([i,(i+1)%seg,ap,c]);
  const base=[]; for(let i=0;i<seg;i++) base.push(i);
  f.push(base.concat(c));
  return fixW(M(v,f));
}

function sphereM(r,seg,rings,colFn){
  const v=[[0,r,0]];
  for (let i=1;i<rings;i++){
    const phi=Math.PI*i/rings;
    const y=Math.cos(phi)*r, rr=Math.sin(phi)*r;
    for (let j=0;j<seg;j++){
      const th=TAU*j/seg;
      v.push([Math.cos(th)*rr, y, Math.sin(th)*rr]);
    }
  }
  const bot=v.length; v.push([0,-r,0]);
  const f=[];
  for (let j=0;j<seg;j++){
    const a=1+j, b=1+(j+1)%seg;
    f.push([0,b,a,colFn(0,j)]);
  }
  for (let i=0;i<rings-2;i++){
    const s0=1+i*seg, s1=1+(i+1)*seg;
    for (let j=0;j<seg;j++){
      const j2=(j+1)%seg;
      f.push([s0+j, s1+j, s1+j2, s0+j2, colFn(i+1,j)]);
    }
  }
  const last=1+(rings-2)*seg;
  for (let j=0;j<seg;j++){
    const a=last+j, b=last+(j+1)%seg;
    f.push([bot,a,b,colFn(rings-1,j)]);
  }
  return fixW(M(v,f));
}

function torusM(R,r,seg,tube,c1,c2){
  const v=[], f=[];
  for (let i=0;i<seg;i++){
    const a=TAU*i/seg;
    for (let j=0;j<tube;j++){
      const b=TAU*j/tube;
      const rr=R+r*Math.cos(b);
      v.push([Math.cos(a)*rr, r*Math.sin(b), Math.sin(a)*rr]);
    }
  }
  for (let i=0;i<seg;i++){
    const i2=(i+1)%seg;
    for (let j=0;j<tube;j++){
      const j2=(j+1)%tube;
      const a=i*tube+j, b=i2*tube+j, cc=i2*tube+j2, d=i*tube+j2;
      f.push([a,b,cc,d, (i+j)&1 ? c2 : c1]);
    }
  }
  const m=M(v,f); m.noCull = true; return m;
}

/* ================================================================= models */
function rotXM(m,a){
  const c=Math.cos(a), s=Math.sin(a);
  return {v:m.v.map(p=>[p[0], p[1]*c-p[2]*s, p[1]*s+p[2]*c]), f:m.f.map(f=>f.slice())};
}
function rotYM(m,a){
  const c=Math.cos(a), s=Math.sin(a);
  return {v:m.v.map(p=>[p[0]*c+p[2]*s, p[1], -p[0]*s+p[2]*c]), f:m.f.map(f=>f.slice())};
}
function rotZM(m,a){
  const c=Math.cos(a), s=Math.sin(a);
  return {v:m.v.map(p=>[p[0]*c-p[1]*s, p[0]*s+p[1]*c, p[2]]), f:m.f.map(f=>f.slice())};
}
function scaleM(m,sx,sy,sz){
  return {v:m.v.map(p=>[p[0]*sx,p[1]*sy,p[2]*sz]), f:m.f.map(f=>f.slice())};
}

const MODEL = {};

/* ================================================================= voxels */
/* The models are not hand-modelled any more: every character is the ROM
   sprite itself, turned into a solid.  sprite_meshes.json holds the 16x16
   display-orientation colour grid for each character (0 = transparent), so
   the top surface reproduces the arcade bitmap pixel for pixel and the
   silhouette is extruded into side walls.

   greedyRects() merges equal-colour neighbours into rectangles, which keeps
   the face count low (barra = 1 plate, solvalou ~20) without touching the
   artwork.  tiltMesh() then leans the whole slab towards the chase camera:
   the ground is seen at 15..40 degrees, so an untilted plate would be
   squashed to a sliver.  The lean is applied to the geometry itself, the
   model stays a real 3-D solid (walls, back, thickness). */

function greedyRects(grid, cb, W, H){
  W = W || 16; H = H || 16;
  const used = new Uint8Array(W*H);
  for (let y=0; y<H; y++){
    for (let x=0; x<W; x++){
      const c = grid[y][x];
      if (!c || used[y*W+x]) continue;
      let x1 = x;
      while (x1+1 < W && grid[y][x1+1] === c && !used[y*W+x1+1]) x1++;
      let y1 = y;
      grow: while (y1+1 < H){
        for (let xx=x; xx<=x1; xx++){
          const j = (y1+1)*W + xx;
          if (grid[y1+1][xx] !== c || used[j]) break grow;
        }
        y1++;
      }
      for (let yy=y; yy<=y1; yy++)
        for (let xx=x; xx<=x1; xx++) used[yy*W+xx] = 1;
      cb(x, y, x1, y1, c);
    }
  }
}

/* Sprite lies on the ground plane (sprite up = away from the camera) and is
   extruded upwards.  Top = the ROM bitmap, walls = the silhouette.          */
function voxelMesh(name){
  const def = MESH_DEF[name];
  if (!def) return null;
  const g = def.grid, px = def.px, hg = def.h;
  const gh = g.length, gw = g[0].length;
  const cx = gw/2, cz = gh/2;
  const v = [], f = [];
  const V = (x,y,z) => { v.push([x,y,z]); return v.length-1; };
  const solid = (x,y) => x>=0 && x<gw && y>=0 && y<gh && g[y][x] !== 0;

  greedyRects(g, (x0,y0,x1,y1,c) => {
    const X0=(x0-cx)*px, X1=(x1+1-cx)*px;
    const ZF=(cz-y0)*px, ZN=(cz-(y1+1))*px;        // far / near edge of the rect
    const a=V(X0,hg,ZF), b=V(X1,hg,ZF), e=V(X1,hg,ZN), d=V(X0,hg,ZN);
    f.push([a,b,e,d,c]);
  }, gw, gh);

  /* walls facing +/-Z: runs along x */
  for (let y=0; y<gh; y++){
    for (let far=0; far<2; far++){
      const ny = far ? y-1 : y+1;
      let x = 0;
      while (x < gw){
        const c = g[y][x];
        if (!c || solid(x,ny)){ x++; continue; }
        let x1 = x;
        while (x1+1 < gw && g[y][x1+1] === c && !solid(x1+1,ny)) x1++;
        const X0=(x-cx)*px, X1=(x1+1-cx)*px;
        const Z = far ? (cz-y)*px : (cz-(y+1))*px;
        let a,b,e,d;
        if (far){ a=V(X0,0,Z); b=V(X1,0,Z); e=V(X1,hg,Z); d=V(X0,hg,Z); }
        else    { a=V(X0,0,Z); b=V(X0,hg,Z); e=V(X1,hg,Z); d=V(X1,0,Z); }
        f.push([a,b,e,d,c]);
        x = x1+1;
      }
    }
  }
  /* walls facing +/-X: runs along y */
  for (let x=0; x<gw; x++){
    for (let right=0; right<2; right++){
      const nx = right ? x+1 : x-1;
      let y = 0;
      while (y < gh){
        const c = g[y][x];
        if (!c || solid(nx,y)){ y++; continue; }
        let y1 = y;
        while (y1+1 < gh && g[y1+1][x] === c && !solid(nx,y1+1)) y1++;
        const X = (right ? x+1 : x)*px - cx*px;
        const ZF=(cz-y)*px, ZN=(cz-(y1+1))*px;
        let a,b,e,d;
        if (right){ a=V(X,0,ZF); b=V(X,0,ZN); e=V(X,hg,ZN); d=V(X,hg,ZF); }
        else      { a=V(X,0,ZN); b=V(X,0,ZF); e=V(X,hg,ZF); d=V(X,hg,ZN); }
        f.push([a,b,e,d,c]);
        y = y1+1;
      }
    }
  }
  return {v:v, f:f};
}

/* Upright standee: sprite up = world up (used for the S flag, which the ROM
   draws as a flag on a pole rather than as a ground plan).                  */
function standeeMesh(name){
  const def = MESH_DEF[name];
  if (!def) return null;
  const g = def.grid, px = def.px, d = def.h;
  const zf = -d*0.5, zb = d*0.5;
  const v = [], f = [];
  const V = (x,y,z) => { v.push([x,y,z]); return v.length-1; };
  let ymax = 0;
  for (let y=0; y<16; y++) for (let x=0; x<16; x++) if (g[y][x] && y>ymax) ymax = y;
  const base = (15-ymax)*px;                    // lowest painted pixel sits on y=0
  const Y = y => (15-y)*px - base;
  greedyRects(g, (x0,y0,x1,y1,c) => {
    const X0=(x0-8)*px, X1=(x1+1-8)*px, YT=Y(y0), YB=Y(y1+1);
    const a=V(X0,YT,zf), b=V(X1,YT,zf), e=V(X1,YB,zf), dd=V(X0,YB,zf);
    f.push([a,b,e,dd,c]);
    const p=V(X0,YB,zb), q=V(X1,YB,zb), r=V(X1,YT,zb), t=V(X0,YT,zb);
    f.push([p,q,r,t,0x59606e]);
  });
  return {v:v, f:f};
}

/* lean the slab towards the camera, then drop it back onto y = 0 */
function tiltMesh(m, a){
  const c = Math.cos(a), s = Math.sin(a);
  let mn = 1e9;
  for (const p of m.v){
    const y = p[1]*c - p[2]*s, z = p[1]*s + p[2]*c;
    p[1] = y; p[2] = z;
    if (y < mn) mn = y;
  }
  for (const p of m.v) p[1] -= mn;
  return m;
}

function buildModels(){
  /* Ground objects lie on the map plane (no extra lean): the chase camera
     already foreshortens them exactly like the terrain, so their base sits
     on the map position.  Only the flying things lean towards the camera. */
  const G_TILT = 0;
  const A_TILT = -0.55;
  const P_TILT = -0.45;

  function part(name, tilt, fallback){
    const m = voxelMesh(name);
    if (!m) return fallback || boxM(4,4,4,PAL.ink);
    return tilt ? tiltMesh(m, tilt) : m;
  }

  MODEL.solvalou    = part('solvalou',    P_TILT);
  MODEL.barra       = part('barra',       G_TILT);
  MODEL.zolbak      = part('zolbak',      G_TILT);
  MODEL.logram      = part('logram',      G_TILT);
  MODEL.sol         = part('sol',         G_TILT);
  /* SOL tower rising frames: ROM sol_tower_animation_tbl at 0x1EF1
     (0xA8,0xA9,0xAA,0xAB,0xAE,0xB2,0xB6).  From frame 4 on the sprite is
     2x2 (32x32), so those meshes carry a 32x32 colour grid. */
  MODEL.solF = [];
  for (let i=0;i<7;i++) MODEL.solF.push(part('sol'+i, G_TILT, MODEL.sol));
  MODEL.sol = MODEL.solF[6];
  MODEL.domogram    = part('domogram',    G_TILT);
  MODEL.special_flag= standeeMesh('special_flag');

  /* ---- Boza Logram: ROM core (58) + the four logram pods (44) that the
     arcade places north/south/east/west around it ------------------------ */
  {
    const core = voxelMesh('boza_logram');
    const pod  = voxelMesh('logram');
    const parts = [];
    if (core) parts.push(bake(scaleM(core, 0.85, 0.85, 0.85), 0, 0, 0));
    /* core half-extent 8.84, pod half-extent 4.99 after the scales below,
       so 11.5 puts each pod 2.3 units inside the core face (they merge). */
    for (const [dx,dz] of [[-11.5,0],[11.5,0],[0,-11.5],[0,11.5]]){
      if (pod) parts.push(bake(scaleM(pod, 0.85, 0.85, 0.85), dx, 0, dz));
    }
    MODEL.boza_logram = parts.length ? merge(parts) : boxM(4,4,4,PAL.ink);
  }

  MODEL.giddo_spario= part('giddo_spario',A_TILT);
  MODEL.toroid      = part('toroid',      0);   /* flat ring: spins in its own plane */
  MODEL.jara        = part('jara',        0);
  MODEL.torkan      = part('torkan',      A_TILT);
  MODEL.kapi        = part('kapi',        A_TILT);
  MODEL.zakato      = part('zakato',      A_TILT);
  MODEL.garu_zakato = part('garu_zakato', A_TILT);
  MODEL.zoshi       = part('zoshi',       A_TILT);
  MODEL.terrazi     = part('terrazi',     A_TILT);
  MODEL.brag_zakato = part('brag_zakato', A_TILT);
  MODEL.bacura      = part('bacura',      A_TILT);

  /* ---- hidden message trigger (no sprite in the ROM script) ---- */
  MODEL.hidden_message = boxM(2,2,2,PAL.ink);

  /* ---- projectiles: analytic solids, not characters ---- */
  MODEL.bullet = octaM(2.5,5,PAL.yellow,PAL.orange);
  MODEL.bomb   = octaM(3.5,7,PAL.orange,PAL.yellow);
  MODEL.shard  = octaM(2,2.5,PAL.white,PAL.orange);
}

function cyclePitch(){
  S.pitchIdx = (S.pitchIdx + 1) % PITCH_STEPS.length;
  S.pitchTarget = PITCH_STEPS[S.pitchIdx];
}
function togglePause(){
  if (S.mode === 'play'){ S.mode = 'pause'; musicStop(); }
  else if (S.mode === 'pause'){ S.mode = 'play'; playMainTheme(); }
}
/* every "fire" entrypoint funnels through here so the on-screen pad and the
   keyboard behave identically (and a tap starts the game from the title) */
function tapZap(){
  if (S.mode === 'title' || S.mode === 'over'){ startGame(); return; }
  if (S.mode === 'play') fireZapper();
}
function tapBomb(){ if (S.mode === 'play') fireBlaster(); }

addEventListener('pointerdown', () => { audioInit(); if (AU.ctx && AU.ctx.state==='suspended') AU.ctx.resume(); });
addEventListener('keydown', e => {
  audioInit(); if (AU.ctx && AU.ctx.state==='suspended') AU.ctx.resume();
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  keys[k.toLowerCase()] = true;
  if (k === ' ') tapZap();
  if (k.toLowerCase() === 'z') tapBomb();
  if (k.toLowerCase() === 'p') togglePause();
  if (k.toLowerCase() === 'c') cyclePitch();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---- on-screen controls (phone / tablet).  The buttons sit *below* the
   play area in their own row, so they never cover the game.  Each pointer is
   captured by its own button, which makes pressing two at once reliable. */
function setPad(k, down){
  switch (k){
    case 'left':  keys['arrowleft']  = down; break;
    case 'right': keys['arrowright'] = down; break;
    case 'up':    keys['arrowup']    = down; break;
    case 'down':  keys['arrowdown']  = down; break;
    case 'zap':   padState.zap  = down; if (down) tapZap();  break;
    case 'bomb':  padState.bomb = down; if (down) tapBomb(); break;
    case 'view':  if (down) cyclePitch(); break;
    case 'pause': if (down) togglePause(); break;
  }
}
function bindPad(){
  const pad = document.getElementById('pad');
  for (const el of pad.querySelectorAll('button')){
    const k = el.dataset.k;
    const down = e => {
      e.preventDefault();
      el.classList.add('on');
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      setPad(k, true);
    };
    const up = e => { e.preventDefault(); el.classList.remove('on'); setPad(k, false); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  /* tapping the playfield starts the game, like SPACE on the keyboard */
  cvs.addEventListener('pointerdown', e => {
    if (S.mode === 'title' || S.mode === 'over') startGame();
  });
}
/* scale the 640x480 canvas to whatever room is left beside the pad */
function fit(){
  const pad  = document.getElementById('pad');
  const help = document.getElementById('help');
  const padShown = pad && getComputedStyle(pad).display !== 'none';
  const padH  = padShown ? pad.offsetHeight + 8 : 0;
  const helpH = (help ? help.offsetHeight : 0) + 8;
  const availW = Math.max(200, window.innerWidth  - 24);
  const availH = Math.max(150, window.innerHeight - 24 - padH - helpH);
  const s = Math.min(availW / W, availH / H);
  cvs.style.width  = Math.round(W * s) + 'px';
  cvs.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 150));

function banner(txt){ S.msgText = txt; S.msg = 120; }

/* ============================================================ attract mode
   The arcade keeps an idle demo running behind the title artwork: the main
   ROM's `attract_mode_gameplay` stage starts SOLVALOU_SND only when
   attract_mode_stage is 0, so the demo runs *without* the theme.  We do the
   same, and the demo Solvalou is invulnerable (it is a recording, not a run). */
function demoAI(){
  keys['arrowleft'] = keys['arrowright'] = keys['arrowup'] = false;
  let tgt = null, bd = 1e9, airTarget = false;
  for (const e of air){
    if (e.dead) continue;
    const dz = e.z - S.camZ;
    if (dz < 80 || dz > 760) continue;
    const d = Math.abs(e.x - S.px) + dz*0.30;
    if (d < bd){ bd = d; tgt = e; airTarget = true; }
  }
  for (const g of ground){
    if (!g.alive || g.hidden) continue;
    const dz = g.z - S.camZ;
    if (dz < 80 || dz > 560) continue;
    const d = Math.abs(g.x - S.px) + dz*0.55 + 30;
    if (d < bd){ bd = d; tgt = g; airTarget = false; }
  }
  if (tgt){
    const dx = tgt.x - S.px;
    if (dx < -6) keys['arrowleft'] = true;
    else if (dx > 6) keys['arrowright'] = true;
    const dz = tgt.z - S.camZ;
    if (Math.abs(dx) < 26 && dz < (airTarget ? 520 : 430)){
      if (airTarget){ if ((S.t % 7) === 0) fireZapper(); }
      else if ((S.t % 17) === 0) fireBlaster();
    }
  }
  if ((S.t % 900) < 40) keys['arrowup'] = true;      /* occasional surge */
}

  S.wave = 0; S.waveT = 30; S.diff = 0; S.diffAt = START_Z; S.lap = 0;
  S.msg = 0; S.msgText = ''; S.secret = 0; S.overTimer = 0;
  air = []; shots = []; ebullets = []; fx = []; parts = []; scorches = [];

/* ============================================================ ROM content */
function buildGround(){
  ground = [];
  scripted = [];
  const lapOff = (S.lap||0) * MAPH;
  for (const s of AREA.spawns){
    const z = s.z + lapOff;              /* ROM row -> strip row (verified) */
    if (s.where === 'air'){
      scripted.push({ char:s.char, x:s.x, z:z, spawned:false, pts:s.pts });
      continue;
    }
    if (s.where === 'hidden'){
      ground.push({
        char:s.char, x:s.x, z:z, mesh:MODEL[s.char]||null,
        hidden:true, revealed:false, alive:true, pts:s.pts,
        spin:0, glint:0, y:0, scale:1, revealT:-1
      });
      continue;
    }
    ground.push({
      char:s.char, x:s.x, z:z, mesh:MODEL[s.char], y:0,
      hidden:false, revealed:true, alive:true, pts:s.pts,
      spin:0, glint:0, scale:1
    });
  }
}

/* ROM: one bullet object per shot, sprite code 0x16/0x17 +0x100 bank
   (278/279), colour 0x23/0x24.  Both zapper sparks live inside that single
   16x16 sprite (they sit at +/-6 px), so the twin shot is one object. */
function fireZapper(){
  let live=0; for (const s of shots) if (s.kind==='z') live++;
  if (live>=3) return;                       /* arcade: 3 bullet objects */
  shots.push({kind:'z', side:0, x:S.px, y:SHIP_Y,
              z:S.camZ+SHIP_DZ, v:6.5, t:0});
  sfx('zap');
}
function fireBlaster(){
  for (const s of shots) if (s.kind==='b') return;
  shots.push({kind:'b', x0:S.px, z0:S.camZ+SHIP_DZ, x:S.px, z:S.camZ+SHIP_DZ, y:SHIP_Y, t:0});
  sfx('bomb');
}

const AIR_PTS = { toroid:30, jara:150, torkan:50, giddo_spario:10,
                  zoshi:100, zakato:150, kapi:300, terrazi:700,
                  brag_zakato:600 };

/* difficulty -> [ [kind, count, variant], ... ] (see the table above) */
function waveFor(diff){
  for (let i=0;i<AIR_TABLE.length;i++){
    const t = AIR_TABLE[i];
    if (diff>=t[0] && diff<=t[1]) return t[2];
  }
  return [["toroid",3,0]];
}

function spawnAir(kind, x, z, hp, pts, seed, extra){
  const e = {
    kind:kind, x:x, y:90, z:z, vx:0, vy:0, vz:0, t:0, phase:0,
    hp:hp, pts:pts, spin:seed*0.7, mesh:MODEL[kind], scale:1,
    fireAt:70 + (seed*13)%80, fired:false, seed:seed, roll:0,
    coin: false,
    pitch: 0,
    /* arcade timing: torkan 64..127 frames, kapi 48..111, zakato 40..89 */
    timer: kind==='torkan' ? 64 + (seed*37)%64
         : kind==='kapi'   ? 48 + (seed*29)%64
         : kind==='zakato' ? 40 + (seed*23)%50
         : kind==='garu_zakato' ? 110 + (seed*17)%60
         : 90 + (seed*11)%40,
    variant: seed & 1
  };
  if (extra) Object.assign(e, extra);
  air.push(e);
}

function spawnWave(){
  const groups = waveFor(S.diff);
  const baseZ = S.camZ + 660;          // just past the horizon
  let i = 0;
  for (const [kind, count, variant] of groups){
    for (let k2=0; k2<count; k2++, i++){
      /* the arcade spawns 1..15 characters from the left and keeps the
         player's own column free for toroid/jara */
      const side = (i & 1) ? 1 : -1;
      const off = 44 + ((i*53) % 120);
      let x = clamp(S.px + side*off, X0+22, X0+202);
      if (kind==='toroid' || kind==='jara'){
        if (Math.abs(x - S.px) < 40) x = clamp(S.px + side*56, X0+22, X0+202);
      }
      spawnAir(kind, x, baseZ + (i>>1)*30, 1, AIR_PTS[kind]||10,
               S.wave*7 + i, {variant:variant});
    }
  }
  S.wave++;
}
function shootAt(e, spread){
  /* Only enemies close enough to the ship open fire (the arcade enemies do
     not snipe from across the whole area). */
  const PZ = S.camZ + SHIP_DZ;
  if (e.z - PZ > 780) return false;
  if (ebullets.length >= 8) return false;   // never build a bullet wall
  /* Aim at the ship, but with a deterministic offset so that a stationary
     ship is not hit by every single shot.  (No Math.random: the same seed
     always produces the same spread, which keeps runs reproducible.) */
  const jx = ((e.seed*29 + S.t*37) % 53) - 26;
  const jy = ((e.seed*17 + S.t*23) % 17) - 8;
  const tx=S.px + jx, ty=SHIP_Y + jy, tz=PZ;
  let dx=tx-e.x, dy=ty-e.y, dz=tz-e.z;
  const len=Math.hypot(dx,dy,dz)||1;
  const sp=2.7;
  ebullets.push({x:e.x, y:e.y, z:e.z, vx:dx/len*sp, vy:dy/len*sp, vz:dz/len*sp});
  return true;
}

/* ================================================================ effects */
function boom(x,y,z,big){
  fx.push({x:x, y:y, z:z, t:0, big:big});
  const n = big?18:9;
  for (let i=0;i<n;i++){
    const a=Math.random()*TAU, b=Math.random()*Math.PI-Math.PI/2;
    const sp=(big?3.2:2.1)*(0.5+Math.random()*0.9);
    parts.push({
      x:x, y:y, z:z,
      vx:Math.cos(a)*Math.cos(b)*sp,
      vy:Math.sin(b)*sp+1.6,
      vz:Math.sin(a)*Math.cos(b)*sp,
      t:0, life:26+Math.random()*22, size:(big?2.6:1.6)*(0.7+Math.random()*0.7),
      col: Math.random()<0.45?PAL.yellow:(Math.random()<0.5?PAL.orange:PAL.red)
    });
  }
}

function damage(){
  if (S.mode==='title') return;              /* the attract demo is a recording */
  if (S.inv>0) return;
  S.lives--; S.inv=150;
  S.diff = clamp(S.diff-16, 0, 127);        // arcade NORMAL: -16
  sfx('die');
  /* taking a hit clears the incoming fire around the ship */
  const PZ=S.camZ+SHIP_DZ;
  ebullets = ebullets.filter(b =>
    Math.abs(b.x-S.px)>150 || Math.abs(b.z-PZ)>700);
  boom(S.px, SHIP_Y, S.camZ+SHIP_DZ, true);
  if (S.lives<=0){
    S.mode='over'; S.overTimer=0;
    if (S.score>S.hi){ S.hi=S.score; saveHi(); }
    musicStop();
  }
  /* The MAIN_THEME_SND fanfare is the level-start jingle (startGame only).
     After losing a ship the in-flight theme (SOLVALOU_SND) keeps running, so
     no fanfare is replayed here.  sfx('die') above is the 54XX explosion. */
}
function addScore(v){
  S.score += v;
  if (S.mode!=='title' && S.score>S.hi){ S.hi=S.score; saveHi(); }
}

/* ================================================================ update */
function update(){
  S.t++;
  if (S.msg>0) S.msg--;
  if (S.secret>0) S.secret--;
  /* the arcade holds the GAME OVER screen for 128 frames, then goes back to
     the attract loop (game_over_1_player -> main_thread_main_loop) */
  if (S.mode==='over'){
    if (++S.overTimer > 128){ enterTitle(); return; }
  }

  /* smooth the camera pitch, then use PC/PS everywhere in the projection */
  S.pitch += (S.pitchTarget - S.pitch) * 0.18;
  PC = Math.cos(S.pitch); PS = Math.sin(S.pitch);

  if (S.mode==='title') demoAI();
  if (S.mode!=='play' && S.mode!=='title') return;

  /* held pad buttons auto-fire, like holding the arcade button */
  if (S.mode === 'play'){
    if (padState.zap  && (S.t % 6)  === 0) fireZapper();
    if (padState.bomb && (S.t % 20) === 0) fireBlaster();
  }

  /* ---- camera / player ------------------------------------------------ */
  const ax = (keys['arrowleft']||keys['a']?-1:0) + (keys['arrowright']||keys['d']?1:0);
  const ay = (keys['arrowup']||keys['w']?-1:0) + (keys['arrowdown']||keys['s']?1:0);
  S.px = clamp(S.px + ax*3.2, PXMIN, PXMAX);
  S.bank += (ax - S.bank)*0.16;
  S.camX = BANDC + (S.px-BANDC)*0.55;

  /* up = fly forward, down = brake / back up (smoothed chase-camera speed) */
  const wantSpd = ay<0 ? 2.6 : (ay>0 ? -1.4 : SCROLL);
  S.spd += (wantSpd - S.spd)*0.14;
  S.camZ += S.spd;
  if (S.camZ < 40) S.camZ = 40;
  if (S.inv>0) S.inv--;

  /* next lap: the terrain tiles wrap at MAPH, so we keep flying and place the
     next area's objects one MAPH further on.  No camera jump. */
  if (S.camZ > LOOP_Z + S.lap*MAPH){
    S.lap++; S.area++; S.wave=0; S.waveT=30;
    buildGround();
    if (S.mode==='play') banner('AREA '+S.area);
    sfx('area');
  }

  /* ---- air waves: arcade difficulty table ---------------------------- */
  if (S.waveT > 0) S.waveT--;
  else if (air.length < 3){ spawnWave(); S.waveT = WAVE_FRAMES; }
  else S.waveT = 30;

  /* difficulty rises as the player advances (arcade: +2 at fixed points) */
  while (S.camZ > S.diffAt){
    S.diffAt += 128;
    S.diff = clamp(S.diff + 2, 0, 127);
  }

  /* ---- scripted air enemies from the ROM script ----------------------- */
  for (const s of scripted){
    if (!s.spawned && s.z <= S.camZ + 1200){
      s.spawned = true;
      spawnAir(s.char, s.x, s.z, 1, s.pts, (s.z|0)%97,
               {y:104, vz:-1.2, vx:sign(S.px-s.x)*0.9, spinPhase:true});
    }
  }

  /* ---- air enemy behaviour (from the arcade disassembly) -------------
     Speeds are the arcade's screen speeds in px/frame; the world scrolls at
     SCROLL, so screen-down S becomes vz = SCROLL - S.                     */
  const PX=S.px, PZ=S.camZ+SHIP_DZ;
  const SCR=SCROLL;

  function aim(e, speed){
    /* the arcade stores the direction as one of 32 angles, so distant
       enemies fly almost straight instead of homing exactly */
    const dx = PX - e.x, dz = Math.max(40, e.z - PZ);
    const step = Math.PI/16;
    const a = Math.round(Math.atan2(dx, dz)/step)*step;
    e.vx = speed*Math.sin(a);
    e.vz = SCR - speed*Math.cos(a);
  }

  for (const e of air){
    e.t++;
    e.spin += 0.022;
    const dx = PX - e.x;
    const dzp = e.z - PZ;

    if (e.kind==='toroid' || e.kind==='jara'){
      /* ROM: the swing starts when the ship's own column is reached
         (is_close_to_solvalou_Y: |dY| <= 2) and then the horizontal speed
         ramps up by 1/16 px per frame, while the depth speed is unchanged.
         The ring must NOT start turning while it is still drifting towards
         the ship: the turn is tied to the escape acceleration, so it begins
         once the sideways speed is actually building up. */
      const spd  = e.kind==='toroid' ? 1.5 : 3.0;
      /* 6 px: the 32-direction aim table can leave the ring a few px off
         the column, so a tighter window would never trigger. */
      const prox = e.kind==='toroid' ? 6 : 12;
      const ACC  = 0.0625;                 /* dY += +-1/16 per frame */
      if (e.phase===0){
        e.spin = 0;                        /* approach sprite is static */
        aim(e, spd);
        if (Math.abs(dx) <= prox){
          e.phase = 1;
          e.swing = (e.x >= PX) ? 1 : -1;  /* accelerate away in X */
          e.spinDir = e.swing;
          e.vx = 0;                        /* no residual drift towards us */
          e.roll = 0;
          if (e.variant) shootAt(e);
        }
      } else {
        e.vx = clamp(e.vx + e.swing*ACC, -4, 4);
        /* sideways speed away from the ship; the coin turn starts once the
           escape is really accelerating (2 frames after the swing begins) */
        if (e.vx*e.swing > ACC*1.5)
          e.roll = ((e.roll||0) - e.spinDir*0.39) % TAU;
      }
    } else if (e.kind==='torkan'){
      /* 64..127 frames at speed 2, one shot, then 180 degrees at speed 3 */
      if (e.phase===0){
        aim(e, 2.0);
        if (e.t>=e.timer){
          e.phase = 1; e.roll = Math.PI; shootAt(e);
          const dx = PX - e.x, dz = Math.max(40, e.z - PZ);
          const L = Math.hypot(dx, dz);
          e.vx = -3.0*dx/L;
          e.vz = SCR + 3.0*dz/L;           /* straight up-screen */
        }
      }
    } else if (e.kind==='kapi'){
      /* 48..111 frames at speed 2, then dX -= 2/16 and dY += +-1/16 */
      if (e.phase===0){
        aim(e, 2.0);
        if (e.t>=e.timer){ e.phase=1; e.swing = dzp>0 ? -1 : 1; }
      } else {
        e.vx -= 0.125;
        e.vz += e.swing*0.0625;
        if ((e.t & 15)===0) shootAt(e);
      }
    } else if (e.kind==='giddo_spario'){
      aim(e, 4.0);                          /* rushes straight at the ship */
    } else if (e.kind==='zoshi'){
      /* 1.5 at the ship; every random interval it fires and re-aims */
      if (e.phase===0){
        aim(e, 1.5);
        if (e.t>=e.timer){
          shootAt(e);
          e.phase = 1; e.timer = e.t + 45 + (e.seed*13)%40;
        }
      } else {
        aim(e, e.variant===1 ? 1.5 : 0.8);
        if (e.t>=e.timer){
          shootAt(e);
          e.phase = 0; e.timer = e.t + 45 + (e.seed*11)%40;
        }
      }
    } else if (e.kind==='zakato'){
      /* teleports in and slides horizontally at 1.0; leaves one shot */
      if (!e.dirSet){ e.dirSet = true; e.vx = (PX>=e.x?1:-1)*1.0; e.vz = SCR; }
      if (e.t>=e.timer){ shootAt(e); e.dead = true; }
    } else if (e.kind==='garu_zakato'){
      /* slides horizontally at 3.0, then bursts into a 16-way ring */
      if (!e.dirSet){ e.dirSet = true; e.vx = (PX>=e.x?1:-1)*3.0; e.vz = SCR; }
      if (!e.burst && e.t>=e.timer){
        e.burst = true;
        for (let k=0;k<16;k++){
          const a = k*Math.PI/8;
          ebullets.push({x:e.x, y:e.y, z:e.z,
                         vx:Math.cos(a)*2.5, vy:0, vz:SCR-Math.sin(a)*2.5,
                         life:90});
        }
        e.dead = true;
      }
    } else if (e.kind==='bacura'){
      e.vz = SCR - 1.0;
    }

    /* no side clamp: escaping enemies leave the play band and are removed
       once they are outside the visible width for their depth */
    e.x += e.vx;
    e.z += e.vz;
    if (e.z < S.camZ + 20) e.dead = true;
    const dzv = Math.max(60, e.z - S.camZ);
    if (Math.abs(e.x - S.camX) > dzv*(W/2)/FOCAL + 80) e.dead = true;
  }

  air = air.filter(e => {
    if (e.z < S.camZ-140 || e.z > S.camZ+1900) return false;
    if (e.hp>0 && e.z < PZ+12 && e.z > PZ-12 &&
        Math.abs(e.x-PX)<10 && e.y<105){ damage(); return false; }
    return true;
  });

  /* ---- player shots -------------------------------------------------- */
  for (const s of shots){
    if (s.kind==='z'){
      s.z += s.v;
      s.t = (s.t||0) + 1;
    } else {
      s.t++;
      const k=Math.min(1, s.t/38);
      s.x = s.x0 + (S.px-s.x0)*k;
      s.z = s.z0 + ((S.camZ+RET_DZ)-s.z0)*k;
      s.y = SHIP_Y*(1-k)*(1-k);
      if (k>=1 && !s.done){ s.done=true; impact(s.x, s.z); }
    }
  }
  for (const s of shots){
    if (s.kind!=='z') continue;
    for (const e of air){
      if (e.hp<=0) continue;
      if (Math.abs(e.x-s.x)<32 && Math.abs(e.z-s.z)<52 && Math.abs(e.y-s.y)<120){
        s.dead=true;
        if (e.kind==='bacura') break;
        e.hp--;
        boom(e.x,e.y,e.z,false);
        if (e.hp<=0){ e.dead=true; addScore(e.pts); boom(e.x,e.y,e.z,false);
                      sfx('airkill'); }
        break;
      }
    }
  }
  shots = shots.filter(s => !s.dead && !s.done && s.z < S.camZ+1500 && (s.kind==='z' || s.t<=38));
  air = air.filter(e => !e.dead);

  /* ---- enemy bullets ------------------------------------------------- */
  for (const b of ebullets){
    b.x+=b.vx; b.y+=b.vy; b.z+=b.vz;
    if (b.life!==undefined && --b.life<=0) b.dead=true;
    if (Math.abs(b.x-PX)<18 && Math.abs(b.y-SHIP_Y)<18 && Math.abs(b.z-PZ)<24){
      b.dead=true; damage();
    }
  }
  ebullets = ebullets.filter(b => !b.dead && b.z>S.camZ-80 && b.z<S.camZ+1600 && b.y>-10 && b.y<260);

  /* ---- hidden-target glint (sol reacts to the reticle) ---------------- */
  for (const g of ground){
    if (g.alive && g.hidden && g.char==='sol'){
      const rz=S.camZ+RET_DZ;
      g.glint = (Math.abs(g.x-S.px)<62 && Math.abs(g.z-rz)<86) ? 30 : 0;
    } else g.glint=0;
  }
  for (const g of ground){
    if (g.alive && g.z < S.camZ-30) g.alive=false;
    if (g.invuln>0) g.invuln--;
    /* SOL tower rising: 7 ROM frames, 16 frames each (112 total) */
    if (g.char==='sol' && g.revealT>=0 && g.revealT<112) g.revealT++;
  }
  scorches = scorches.filter(s => s.z > S.camZ-100 && s.z < S.camZ+1700);
  for (const s of scorches) if (s.t<8) s.t++;

  /* ---- particles ----------------------------------------------------- */
  for (const p of parts){
    p.t++; p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
    p.vy -= 0.14;
    if (p.y<0){ p.y=0; p.vy*=-0.32; p.vx*=0.7; p.vz*=0.7; }
  }
  parts = parts.filter(p => p.t<p.life);
  for (const f of fx) f.t++;
  fx = fx.filter(f => f.t<40);
}

function impact(x,z){
  boom(x,0,z,true);
  /* One bomb takes out the closest target only (the arcade blaster does not
     clear a whole cluster in a single shot). */
  let best=null, bd=Infinity;
  for (const g of ground){
    if (!g.alive) continue;
    const dx=g.x-x, dz=g.z-z;
    if (Math.abs(dx)>=62 || Math.abs(dz)>=70) continue;
    const d=dx*dx+dz*dz;
    if (d<bd){ bd=d; best=g; }
  }
  if (best) hitGround(best);          /* hitGround plays the 54XX blast */
  else sfx('explode');                /* empty ground: the short thud only */
}

function hitGround(g){
  if (g.hidden && !g.revealed){
    g.revealed=true; g.hidden=false;
    if (g.char==='sol'){
      addScore(2000); g.pts=2000; g.revealT=0; sfx('sol');
      /* the Sol Tower now grows out of the ground (ROM animation table) */
      boom(g.x, 6, g.z, false);
    } else if (g.char==='special_flag'){
      addScore(1000); g.pts=10000; sfx('flag');
      boom(g.x,4,g.z,false);
    } else if (g.char==='hidden_message'){
      addScore(10); g.alive=false; S.secret=180; sfx('msg');
      S.msgText='ORIGINAL'; S.msg=150;
    }
    return;
  }
  if (g.invuln>0) return;
  /* the Sol Tower is invulnerable while the rise animation plays */
  if (g.char==='sol' && g.revealT>=0 && g.revealT<112) return;
  g.alive=false;
  if (g.char==='zolbak') S.diff = clamp(S.diff-2, 0, 127);   // arcade: -2
  sfx('hit');
  addScore(g.pts);
  addScorch(g.x, g.z);
  boom(g.x, 12, g.z, g.char==='boza_logram');
}

/* Craters: the arcade does not paint a gradient; the bomb explosion object
   ends up as sprite 0xA6, colour 0x0D, flickering with 0xA7 every 4 frames
   (xevious_main.68k:$31D7).  They live in world space and are stamped into
   the terrain rows by stampCraters(), so they always sit under the models. */
function addScorch(x, z){
  scorches.push({x:x, z:z, t:0});
  if (scorches.length > 64) scorches.shift();
}

/* ================================================================= render */
function proj(x,y,z){
  const dz=z-S.camZ;
  if (dz<26) return null;
  const cx=x-S.camX, dy=y-CAMH;
  const yc=dy*PC+dz*PS;
  const zc=-dy*PS+dz*PC;
  if (zc<26) return null;
  return {x:W/2+cx*FOCAL/zc, y:HORIZON-FOCAL*yc/zc, s:FOCAL/zc, dz:zc};
}

const _vx=new Float32Array(8192), _vy=new Float32Array(8192), _vz=new Float32Array(8192);
const _sx=new Float32Array(8192), _sy=new Float32Array(8192);
const LX=-0.41, LY=0.80, LZ=-0.44;

function drawMesh(mesh, wx, wy, wz, yaw, roll, scale, alpha, pitch, sxs, preYaw){
  if (!mesh) return;
  const dz=wz-S.camZ;
  if (dz<26 || dz>2400) return;
  const sc=scale===undefined?1:scale;
  const m=mesh, vs=m.v, nv=vs.length, fs=m.f;
  const cy=Math.cos(yaw||0), sy=Math.sin(yaw||0);
  const cr=Math.cos(roll||0), sr=Math.sin(roll||0);
  const cp=Math.cos(pitch||0), sp2=Math.sin(pitch||0);
  for (let i=0;i<nv;i++){
    const p=vs[i];
    let x=p[0]*sc*(sxs===undefined?1:sxs), y=p[1]*sc, z=p[2]*sc;
    if (preYaw){ const X=x*Math.cos(preYaw)+z*Math.sin(preYaw), Z=-x*Math.sin(preYaw)+z*Math.cos(preYaw); x=X; z=Z; }
    if (roll){ const X=x*cr-y*sr, Y=x*sr+y*cr; x=X; y=Y; }
    if (pitch){ const Y=y*cp-z*sp2, Z=y*sp2+z*cp; y=Y; z=Z; }
    if (yaw){ const X=x*cy+z*sy, Z=-x*sy+z*cy; x=X; z=Z; }
    const cx=wx+x-S.camX, cyy=wy+y, cz=dz+z;
    if (cz<26) return;                       // clip the whole part
    _vx[i]=cx; _vy[i]=cyy; _vz[i]=cz;
    const dyc=cyy-CAMH;
    const yc=dyc*PC+cz*PS;
    const zc=-dyc*PS+cz*PC;
    if (zc<26) return;
    _sx[i]=W/2+cx*FOCAL/zc;
    _sy[i]=HORIZON-FOCAL*yc/zc;
  }
  const list=[];
  for (let fi=0; fi<fs.length; fi++){
    const f=fs[fi];
    const col=f[f.length-1];
    const a=f[0], b=f[1], c=f[2];
    const ux=_vx[b]-_vx[a], uy=_vy[b]-_vy[a], uz=_vz[b]-_vz[a];
    const vx2=_vx[c]-_vx[a], vy2=_vy[c]-_vy[a], vz2=_vz[c]-_vz[a];
    let nx=uy*vz2-uz*vy2, ny=uz*vx2-ux*vz2, nz=ux*vy2-uy*vx2;
    const nl=Math.hypot(nx,ny,nz)||1;
    nx/=nl; ny/=nl; nz/=nl;
    let fx=0, fy=0, fz=0, k=0;
    for (let i=0;i<f.length-1;i++){ const q=f[i]; fx+=_vx[q]; fy+=_vy[q]; fz+=_vz[q]; k++; }
    fx/=k; fy/=k; fz/=k;
    if (!m.noCull && nx*fx + ny*(fy-CAMH) + nz*fz >= 0) continue;
    const zcF = -(fy-CAMH)*PS + fz*PC;
    if (zcF < 26) continue;
    const lam = Math.max(0, nx*LX+ny*LY+nz*LZ);
    const sh = 0.52 + 0.48*lam;
    const fog = clamp((zcF-620)/1250, 0, 0.84);
    list.push({f:f, z:zcF, c:shadeStr(col, sh, fog)});
  }
  list.sort((p,q)=>q.z-p.z);
  if (alpha!==undefined) ctx.globalAlpha=alpha;
  for (let i=0;i<list.length;i++){
    const e=list[i], f=e.f;
    ctx.fillStyle=e.c;
    ctx.beginPath();
    ctx.moveTo(_sx[f[0]], _sy[f[0]]);
    for (let j=1;j<f.length-1;j++) ctx.lineTo(_sx[f[j]], _sy[f[j]]);
    ctx.closePath();
    ctx.fill();
  }
  if (alpha!==undefined) ctx.globalAlpha=1;
}

function drawSprite(code, cx, cy, w, h, alpha){
  const sp=SPR[code];
  if (!sp) return;
  if (alpha!==undefined) ctx.globalAlpha=alpha;
  ctx.drawImage(atlasImg, sp[0], sp[1], 16, 16, Math.round(cx-w/2), Math.round(cy-h/2), w, h);
  if (alpha!==undefined) ctx.globalAlpha=1;
}

/* Crater decals -----------------------------------------------------------
   ROM: the bomb explosion object finishes with _CODE=0xA6, _COLOUR=0x0D and
   then alternates 0xA6/0xA7 every 4 frames while it keeps scrolling with the
   map (xevious_main.68k:$31D7 bomb_explosion_finished).  Both frames are
   stamped straight onto the projected ground rows, so the mark keeps the
   terrain's perspective, shading and fog instead of being a painted blob. */
let CRATER_FRAMES = null;
function craterFrames(){
  if (CRATER_FRAMES) return CRATER_FRAMES;
  const pal = [];
  for (const s of CRATER.pal){
    const r = parseInt(s.substr(1,2),16), g = parseInt(s.substr(3,2),16),
          b = parseInt(s.substr(5,2),16);
    pal.push((255<<24)|(b<<16)|(g<<8)|r);
  }
  const w = CRATER.w, h = CRATER.h;
  CRATER_FRAMES = CRATER.frames.map(rows => {
    const a = new Uint32Array(w*h);
    for (let y=0;y<h;y++){
      const row = rows[y];
      for (let x=0;x<w;x++){
        const ch = row.charAt(x);
        if (ch !== '.') a[y*w+x] = pal[parseInt(ch,16)];
      }
    }
    return a;
  });
  return CRATER_FRAMES;
}

/* the sprite is 16x16, and one sprite pixel is one world unit like the
   ground object meshes, so the crater sits at the arcade's own scale */
const CR_HALF = 8;

function stampCraters(firstGround, c, s){
  if (!scorches.length || !terr32) return;
  const img = craterFrames()[(S.t>>2)&1];   /* 4-frame flicker, as the ROM */
  const w = CRATER.w, h = CRATER.h;
  for (const sc of scorches){
    if (sc.t < 2) continue;
    const z0 = sc.z - CR_HALF, z1 = sc.z + CR_HALF;
    const x0 = sc.x - CR_HALF, x1 = sc.x + CR_HALF;
    const pn = proj(sc.x, 0, z0), pf = proj(sc.x, 0, z1);
    if (!pn || !pf) continue;
    const yStart = Math.max(firstGround, Math.ceil(Math.min(pn.y, pf.y)));
    const yEnd   = Math.min(H-1, Math.floor(Math.max(pn.y, pf.y)));
    for (let y=yStart;y<=yEnd;y++){
      const u=(HORIZON-y)/FOCAL;
      const den=s-u*c;
      if (den<=1e-5) continue;
      const z=CAMH*(u*s+c)/den;
      if (z<=0) continue;
      const wz = S.camZ + z;
      if (wz < z0 || wz >= z1) continue;
      const zc=CAMH*s+z*c;
      const step=zc/FOCAL;
      const xa = W/2 + (x0 - S.camX)/step;
      const xb = W/2 + (x1 - S.camX)/step;
      if (xb < 0 || xa > W) continue;
      const si=(clamp(1.28-z/1500,0.40,1.0)*256)|0;
      const fog=clamp((z-1500)/1100,0,1);
      const ia=1-fog, fr=FOG_R*fog, fg=FOG_G*fog, fb=FOG_B*fog;
      let ty = ((wz - z0) / (2*CR_HALF) * h) | 0;
      ty = ty < 0 ? 0 : ty >= h ? h-1 : ty;
      const rowBase = ty * w;
      const span = Math.max(1e-6, xb - xa);
      const px0 = Math.max(0, Math.ceil(xa)), px1 = Math.min(W-1, Math.floor(xb));
      for (let px=px0;px<=px1;px++){
        let tx = (((px - xa) / span) * w) | 0;
        tx = tx < 0 ? 0 : tx >= w ? w-1 : tx;
        const col = img[rowBase + tx];
        if (!col) continue;
        const r=(((col&255)*si)>>8)*ia+fr;
        const g=((((col>>8)&255)*si)>>8)*ia+fg;
        const b=((((col>>16)&255)*si)>>8)*ia+fb;
        buf32[y*W+px]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
      }
    }
  }
}

function drawTerrain(){
  const c=PC, s=PS;
  const hzRow = HORIZON - FOCAL*(s/Math.max(1e-6,c));  /* pitch moves the horizon */
  const ZMAX = 2600;                                   /* far clip, blended into fog */
  const yStart = Math.max(0, Math.ceil(hzRow));

  /* first row whose ground point is inside the far clip */
  let firstGround = H;
  if (terr32){
    for (let y=yStart;y<H;y++){
      const u=(HORIZON-y)/FOCAL;
      const den=s-u*c;
      if (den<=1e-5) continue;
      const z=CAMH*(u*s+c)/den;
      if (z>0 && z<=ZMAX){ firstGround=y; break; }
    }
  }
  const skyEnd = clamp(firstGround, 0, H);

  /* sky: gradient down to the hazy far edge ------------------------------- */
  const skyRows = Math.max(1, skyEnd);
  for (let y=0;y<skyEnd;y++){
    const f=y/skyRows, k=f*f*(3-2*f);
    const r=(9+(FOG_R-9)*k)|0, g=(13+(FOG_G-13)*k)|0, b=(34+(FOG_B-34)*k)|0;
    const col=(255<<24)|(b<<16)|(g<<8)|r;
    const base=y*W;
    for (let x=0;x<W;x++) buf32[base+x]=col;
  }
  /* warm glow hugging the horizon ---------------------------------------- */
  for (let y=Math.max(0,Math.floor(hzRow-30));y<Math.min(H,hzRow);y++){
    const f=(y-(hzRow-30))/30;
    const a=Math.pow(Math.sin(Math.PI*f),1.6)*0.5;
    const base=y*W;
    for (let x=0;x<W;x++){
      const col=buf32[base+x];
      const r=col&255, g=(col>>8)&255, b=(col>>16)&255;
      buf32[base+x]=(255<<24)|(((b+22*a)|0)<<16)|(((g+30*a)|0)<<8)|((r+26*a)|0);
    }
  }

  /* ground --------------------------------------------------------------- */
  if (terr32){
    for (let y=firstGround;y<H;y++){
      const u=(HORIZON-y)/FOCAL;
      const den=s-u*c;
      if (den<=1e-5) continue;
      const z=CAMH*(u*s+c)/den;            /* pitch-aware inverse projection */
      if (z<=0 || z>ZMAX) continue;
      const zc=CAMH*s+z*c;                 /* view-space depth on this row */
      let ty=(S.camZ+z)|0;
      ty%=MAPH; if (ty<0) ty+=MAPH;
      const shade=clamp(1.28-z/1500,0.40,1.0);
      const si=(shade*256)|0;
      const fog=clamp((z-1500)/1100,0,1);
      const base=y*W, rowBase=ty*MAPW;
      const step=zc/FOCAL;
      let wx=S.camX-(W/2)*step;
      if (fog<0.004){
        for (let x=0;x<W;x++){
          const tx=(wx|0)&(MAPW-1);
          const col=terr32[rowBase+tx];
          buf32[base+x]=(255<<24)|((((col>>16)&255)*si>>8)<<16)|
                                   ((((col>>8)&255)*si>>8)<<8)|(((col&255)*si)>>8);
          wx+=step;
        }
      } else {
        const ia=1-fog, fr=FOG_R*fog, fg=FOG_G*fog, fb=FOG_B*fog;
        for (let x=0;x<W;x++){
          const tx=(wx|0)&(MAPW-1);
          const col=terr32[rowBase+tx];
          const r=(((col&255)*si)>>8)*ia+fr;
          const g=((((col>>8)&255)*si)>>8)*ia+fg;
          const b=((((col>>16)&255)*si)>>8)*ia+fb;
          buf32[base+x]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
          wx+=step;
        }
      }
    }
    stampCraters(firstGround, c, s);     /* ROM crater decals, on the ground */
    for (let y=firstGround;y<H;y+=2){
      const base=y*W;
      for (let x=0;x<W;x++){
        const col=buf32[base+x];
        const r=(col&255)*0.87, g=((col>>8)&255)*0.87, b=((col>>16)&255)*0.87;
        buf32[base+x]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0);
      }
    }
  }
  ctx.putImageData(screen,0,0);
}

function drawSol(g){
  const f = g.revealT<0 ? 6 : Math.min(6, (g.revealT/16)|0);
  const mesh = MODEL.solF[f] || MODEL.sol;
  drawMesh(mesh, g.x, 0, g.z, g.spin||0, 0, 1);
  const p = proj(g.x, 6, g.z);
  if (!p) return;
  /* pulsing_colour_1: the arcade cycles the tower colour every few frames */
  const ph = 0.5 + 0.5*Math.sin(S.t*0.55);
  const rr = Math.max(5, 26*p.s);
  const a = 0.14 + 0.15*ph;
  const grd = ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,rr);
  grd.addColorStop(0,  'rgba(200,245,255,'+(a*0.95).toFixed(3)+')');
  grd.addColorStop(0.5,'rgba(95,195,255,' +(a*0.50).toFixed(3)+')');
  grd.addColorStop(1,  'rgba(40,120,255,0)');
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,TAU); ctx.fill();
  ctx.restore();
  /* dust ring while the tower is pushing out of the ground */
  if (g.revealT>=0 && g.revealT<56){
    const k=g.revealT/56, r=(8+38*k)*p.s;
    ctx.save();
    ctx.strokeStyle='rgba(170,235,255,'+((1-k)*0.55).toFixed(3)+')';
    ctx.lineWidth=Math.max(1,2*p.s);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, Math.max(2,r), Math.max(1,r*0.42), 0,0,TAU);
    ctx.stroke();
    ctx.restore();
  }
}

function drawShadow(g, mul){
  const p=proj(g.x,0,g.z);
  if (!p) return;
  const r=Math.max(2, 20*p.s*0.55*(mul||1));
  const a=clamp(0.34*(1.3-p.dz/1300),0.04,0.34);
  ctx.fillStyle='rgba(0,0,0,'+a.toFixed(3)+')';
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, r, r*0.34, 0, 0, TAU);
  ctx.fill();
}

function drawStar(x,y,r,alpha,c){
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=c; ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(x-r,y); ctx.lineTo(x+r,y);
  ctx.moveTo(x,y-r); ctx.lineTo(x,y+r);
  ctx.stroke();
  ctx.globalAlpha=1;
}

function render(){
  drawTerrain();           /* craters are stamped into the terrain rows */

  /* reticle -------------------------------------------------------------- */
  const rp=proj(S.px,0,S.camZ+RET_DZ);
  if (rp && (S.mode==='play'||S.mode==='pause')){
    ctx.strokeStyle='rgba(130,200,255,.85)';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(rp.x-9,rp.y); ctx.lineTo(rp.x-3,rp.y);
    ctx.moveTo(rp.x+3,rp.y); ctx.lineTo(rp.x+9,rp.y);
    ctx.moveTo(rp.x,rp.y-9); ctx.lineTo(rp.x,rp.y-3);
    ctx.moveTo(rp.x,rp.y+3); ctx.lineTo(rp.x,rp.y+9);
    ctx.stroke();
    ctx.strokeStyle='rgba(130,200,255,.30)';
    ctx.strokeRect(rp.x-13.5,rp.y-13.5,27,27);
  }

  /* build the depth-sorted draw list ------------------------------------ */
  const items=[];
  for (const g of ground){
    if (!g.alive) continue;
    const dz=g.z-S.camZ;
    if (dz<30 || dz>1700) continue;
    items.push({dz:dz, t:'g', o:g});
  }
  for (const e of air){
    const dz=e.z-S.camZ;
    if (dz<30 || dz>2100) continue;
    items.push({dz:dz, t:'e', o:e});
  }
  for (const s of shots){
    const dz=s.z-S.camZ;
    if (dz<25 || dz>1700) continue;
    items.push({dz:dz, t:'s', o:s});
  }
  for (const b of ebullets){
    const dz=b.z-S.camZ;
    if (dz<25 || dz>1700) continue;
    items.push({dz:dz, t:'b', o:b});
  }
  for (const p of parts){
    const dz=p.z-S.camZ;
    if (dz<25 || dz>1800) continue;
    items.push({dz:dz, t:'p', o:p});
  }
  for (const f of fx){
    const dz=f.z-S.camZ;
    if (dz<25 || dz>1800) continue;
    items.push({dz:dz, t:'f', o:f});
  }
  items.push({dz:SHIP_DZ, t:'player', o:null});
  items.sort((a,b)=>b.dz-a.dz);

  for (const it of items){
    const o=it.o;
    if (it.t==='g'){
      if (o.hidden){
        if (o.glint>0){
          const p=proj(o.x,14,o.z);
          if (p) drawStar(p.x,p.y,6+Math.sin(S.t*0.3)*2,0.55+0.35*Math.sin(S.t*0.5),'#9fe8ff');
        }
        continue;
      }
      drawShadow(o, o.char==='sol' ? 1.8 : 1);
      if (o.char==='sol' && o.revealT>=0){ drawSol(o); continue; }
      if (o.invuln>0 && (S.t>>2)&1) continue;
      drawMesh(o.mesh, o.x, 0, o.z, o.spin, 0, 1);
    } else if (it.t==='e'){
      if (o.coin)
        drawMesh(o.mesh, o.x, o.y, o.z, 0, o.roll||0, o.scale||1,
                 undefined, o.pitch||0, 1, o.spin);
      else
        drawMesh(o.mesh, o.x, o.y, o.z, o.spin, o.roll||0, o.scale||1,
                 undefined, o.pitch||0, o.squash===undefined?1:o.squash);
    } else if (it.t==='s'){
      if (o.kind==='z'){
        const p = proj(o.x, o.y, o.z);
        /* arcade animation: code 0x16/0x17 selected by countup_timer bit2,
           colour 0x23/0x24 by bit1 (278/279 with colour 35/36) */
        const code = ((o.t >> 2) & 1) ? 279 : 278;
        const c36  = ((o.t >> 1) & 1);
        if (p) drawSprite(c36 ? code + 1000 : code, p.x, p.y,
                          Math.max(8, 26 * p.s), Math.max(8, 26 * p.s), 1);
      } else drawMesh(MODEL.bomb, o.x, o.y, o.z, S.t*0.35, 0, 1);
    } else if (it.t==='b'){
      drawMesh(MODEL.bullet, o.x, o.y, o.z, S.t*0.2, 0, 1);
    } else if (it.t==='p'){
      drawMesh(MODEL.shard, o.x, o.y, o.z, o.t*0.25, 0, o.size);
    } else if (it.t==='f'){
      const p=proj(o.x,o.y,o.z);
      if (!p) continue;
      const code=96+Math.min(31, Math.floor(o.t/1.15));
      const w=Math.max(8, 16*p.s*(o.big?3.4:2.1));
      drawSprite(code, p.x, p.y, w, w, clamp(1.2-o.dz/1300,0.3,1));
    } else if (it.t==='player'){
      drawPlayer();
    }
  }

  /* secret message ------------------------------------------------------- */
  if (S.secret>0 && S.mode==='play'){
    ctx.save();
    ctx.globalAlpha=Math.min(1,S.secret/40);
    romText('ORIGINAL', W/2, H-104, 3, '#ffe066', 'center');
    romText('HIDDEN MESSAGE 10 PTS', W/2, H-72, 1, '#b9c6d8', 'center');
    ctx.restore();
  }

  hud();
}

function drawPlayer(){
  if (S.mode==='over') return;
  const blink=S.inv>0 && ((S.t>>2)&1);
  const bob=Math.sin(S.t*0.07)*1.2;
  if (!blink){
    drawMesh(MODEL.solvalou, S.px, SHIP_Y+bob, S.camZ+SHIP_DZ, S.bank*0.08, -S.bank*0.34, 1);
  }
  const p=proj(S.px, SHIP_Y+bob, S.camZ+SHIP_DZ-16);
  if (p){
    const g=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,22);
    g.addColorStop(0,'rgba(255,205,120,.60)');
    g.addColorStop(0.5,'rgba(140,200,255,.22)');
    g.addColorStop(1,'rgba(140,200,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,22,0,TAU); ctx.fill();
  }
}

/* ============================================ ROM text (gfx1) and the logo */
let FONT_IMG = null, LOGO_IMG = null;
const TINT = Object.create(null);
/* FG characters are 1bpp masks; MAME maps pen 1 to a base palette entry, so a
   single colour per run.  Tint the white atlas once per colour. */
function tinted(img, colour){
  if (!img) return null;
  const key = (img === FONT_IMG ? 'f' : 'l') + colour;
  let cv = TINT[key];
  if (cv) return cv;
  cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const g = cv.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = colour;
  g.fillRect(0, 0, cv.width, cv.height);
  TINT[key] = cv;
  return cv;
}
/* ROM FG codes: 0x00-0x09 '0'-'9', 0x0A-0x23 'A'-'Z', 0x24 space, 0x25 ship */
function romCode(ch){
  const c = ch.charCodeAt(0);
  if (ch >= '0' && ch <= '9') return c - 48;
  if (ch >= 'A' && ch <= 'Z') return 0x0A + (c - 65);
  if (ch === '.') return 0x50;
  return 0x24;
}
function romTiles(codes, x, y, s, colour, align, shadow){
  const tex = tinted(FONT_IMG, colour);
  if (!tex) return;
  const w = codes.length * 8 * s;
  let px = align === 'center' ? Math.round(x - w/2)
         : align === 'right'  ? Math.round(x - w) : Math.round(x);
  if (shadow){
    const sh = tinted(FONT_IMG, '#000000');
    const o = Math.max(1, Math.round(s*0.7));
    ctx.save();
    ctx.globalAlpha = 0.6;
    for (let i=0;i<codes.length;i++)
      ctx.drawImage(sh, (codes[i] & 15) * 8, (codes[i] >> 4) * 8, 8, 8,
                    px + i*8*s + o, y + o, 8*s, 8*s);
    ctx.restore();
  }
  for (const code of codes){
    ctx.drawImage(tex, (code & 15) * 8, (code >> 4) * 8, 8, 8, px, y, 8*s, 8*s);
    px += 8 * s;
  }
}
function romText(str, x, y, s, colour, align, shadow){
  romTiles([...str].map(romCode), x, y, s, colour, align, shadow);
}
/* display_score writes 3 BCD bytes plus a fixed trailing '0': 7 characters */
function scoreText(v){ return String(Math.max(0, v|0)).padStart(7, ' '); }

/* strCOPYRIGHT ($3ECD): "@(c) 1982 NAMCO LTD."  The ROM's leading 0x2D/0x2E
   are the two halves of a 16x8 (c) that the FG layer draws as one mark; the
   single-tile (c) is 0x28, so the line reads correctly with that one. */
const COPY_CODES = [0x28,0x24,0x01,0x09,0x08,0x02,0x24,
                    0x17,0x0A,0x16,0x0C,0x18,0x24,0x15,0x1D,0x0D,0x50];

/* The arcade HUD, in the ROM's own places and colours:
     display_high_score_text  (attr 0x1F -> #ffae00) top centre
     display_player_scores    (attr 0x24 -> #d2d2d2) top left
     display_solvalou_left    (attr 0x2A -> #e0bc62) bottom left, icon 0x25
   Positions on the 224x288 portrait screen: label (81,0), hi digits (89,8),
   score (9,8), lives (9,280).  Our view is 640x480, so the same arrangement is
   scaled by 2. */
const HUD_S = 2, HUD_Y = 6;
function drawHud(){
  romText('HIGH SCORE', W/2, HUD_Y, HUD_S, '#ffae00', 'center', true);
  romText(scoreText(S.hi), W/2, HUD_Y + 8*HUD_S + 2, HUD_S, '#d2d2d2', 'center', true);
  romText(scoreText(S.score), 12, HUD_Y + 8*HUD_S + 2, HUD_S, '#d2d2d2', 'left', true);
  const lives = clamp(S.lives - 1, 0, 8);
  for (let i=0;i<lives;i++)
    romTiles([0x25], 12 + i*9*HUD_S, H - 8*HUD_S - 10, HUD_S, '#e0bc62', 'left', true);
}

function hud(){
  ctx.save();
  ctx.textBaseline='top';
  drawHud();

  if (S.mode==='title'){
    /* attract-mode artwork: the yellow logo the ROM draws over the demo */
    const s = 2, lw = LOGO.w*s, lh = LOGO.h*s;
    const lx = Math.round((W-lw)/2), ly = 56;
    const tex = tinted(LOGO_IMG, LOGO.colour), sh = tinted(LOGO_IMG, '#000000');
    if (tex){
      ctx.globalAlpha = 0.72;
      for (const [dx,dy] of [[-3,0],[3,0],[0,-3],[0,3],[-3,-3],[3,3],[-3,3],[3,-3]])
        ctx.drawImage(sh, lx+dx, ly+dy, lw, lh);
      ctx.globalAlpha = 1;
      ctx.drawImage(tex, lx, ly, lw, lh);
    }
    if (((S.t >> 5) & 1) === 0)
      romText('PUSH START BUTTON', W/2, ly+lh+36, 2, '#ffff00', 'center', true);
    romTiles(COPY_CODES, W/2, H-18, 1, '#d2d2d2', 'center', true);
  }

  if (S.mode==='over'){
    /* the arcade holds GAME OVER for 128 frames, then returns to attract */
    ctx.fillStyle='rgba(20,0,0,.38)';
    ctx.fillRect(0,0,W,H);
    romText('GAME OVER', W/2, 196, 3, '#ff0000', 'center');
    romText(scoreText(S.score), W/2, 250, 2, '#d2d2d2', 'center');
  }

  if (S.mode==='pause'){
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#cfe0ff';
    ctx.font='bold 34px "Yu Gothic UI","Meiryo",sans-serif';
    ctx.fillText('一時停止', W/2, 200);
    ctx.font='16px "Yu Gothic UI","Meiryo",sans-serif';
    ctx.fillText('P / 一時停止で再開', W/2, 252);
    ctx.textAlign='left';
  }

  if (S.msg>0 && S.mode==='play' && S.secret<=0){
    ctx.globalAlpha=Math.min(1,S.msg/40);
    romText(S.msgText, W/2, 96, 3, '#ffff00', 'center');
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* =================================================================== boot */
function loadImage(src){
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
}

async function decodeTerrain(){
  const bin=atob(TERRAIN_GZ_B64);
  const bytes=new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if (typeof DecompressionStream!=='function') throw new Error('DecompressionStream 非対応');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const raw=new Uint8Array(await new Response(stream).arrayBuffer());
  const n=MAPW*MAPH;
  const out=new Uint32Array(n);
  for (let i=0,j=0;i<n;i++,j+=3)
    out[i]=(255<<24)|(raw[j+2]<<16)|(raw[j+1]<<8)|raw[j];
  return out;
}

async function boot(){
  buildModels();
  atlasImg = await loadImage('data:image/png;base64,'+ATLAS_B64);
  for (const k in ATLAS_JSON.sprites) SPR[k]=ATLAS_JSON.sprites[k];
  FONT_IMG = await loadImage('data:image/png;base64,'+FONT_B64);
  LOGO_IMG = await loadImage(LOGO.png);
  terr32 = await decodeTerrain();
  S.camX = BANDC;
  buildGround();

  bindPad();
  fit();
  requestAnimationFrame(fit);        /* after the pad's first layout */
  enterTitle();

  let last=performance.now(), acc=0;
  function frame(now){
    acc += Math.min(now-last,100); last=now;
    while (acc>=16.6667){ update(); acc-=16.6667; }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
